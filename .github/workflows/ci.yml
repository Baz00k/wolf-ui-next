name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dev-tooling:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up mise
        uses: jdx/mise-action@v3
        with:
          install: false

      - name: Validate development tooling
        run: |
          docker compose -f dev/compose.yml config -q
          docker compose -f dev/compose.yml -f dev/compose.prod.yml config -q
          mise tasks ls

  fmt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Rust
        run: rustup show

      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Rust
        run: rustup show

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Generate Tailwind CSS placeholder
        run: |
          mkdir -p crates/wolf-ui/assets/dist
          touch crates/wolf-ui/assets/dist/styles.css

      - name: Install build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            curl \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            libudev-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            pkg-config

      - name: Lint workspace
        run: cargo clippy --workspace --no-default-features --features desktop --locked -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Rust
        run: rustup show

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Generate Tailwind CSS placeholder
        run: |
          mkdir -p crates/wolf-ui/assets/dist
          touch crates/wolf-ui/assets/dist/styles.css

      - name: Install build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            curl \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            libudev-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            pkg-config

      - name: Test workspace
        run: cargo test --workspace --no-default-features --features desktop --locked
