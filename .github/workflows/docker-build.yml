name: Docker build

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - variant: ubuntu
            base_image: ghcr.io/games-on-whales/base-app:edge
            tag_suffix: ""
          - variant: fedora
            base_image: ghcr.io/games-on-whales/base-app:edge-fedora
            tag_suffix: -fedora
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/wolf-ui-next
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=edge,branch=main
            type=sha
          flavor: |
            latest=false
            suffix=${{ matrix.tag_suffix }}
          labels: |
            io.gamesonwhales.wolf-ui.runtime=${{ matrix.variant }}
            org.opencontainers.image.base.name=${{ matrix.base_image }}
            org.opencontainers.image.description=Wolf UI Next (${{ matrix.variant }} runtime)

      - name: Build and publish image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BASE_APP_IMAGE=${{ matrix.base_image }}
            IMAGE_SOURCE=${{ github.server_url }}/${{ github.repository }}
            IMAGE_REVISION=${{ github.sha }}
            IMAGE_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha,scope=wolf-ui-next-linux-amd64-${{ matrix.variant }}
          cache-to: type=gha,scope=wolf-ui-next-linux-amd64-${{ matrix.variant }},mode=max
